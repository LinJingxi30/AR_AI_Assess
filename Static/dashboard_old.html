<!DOCTYPE html>
<html lang="zh-cn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>设备监控</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  </head>
  <body class="bg-gray-100 text-gray-800">
    <header class="bg-blue-600 text-white py-4 text-center">
      <h1 class="text-2xl font-bold">设备监控</h1>
    </header>
    <div class="container mx-auto p-4">
      <div class="flex justify-center mb-6">
        <select id="action-select" class="border border-gray-300 rounded px-4 py-2">
          <option value="default">选择动作</option>
          <option value="action1">动作1</option>
          <option value="action2">动作2</option>
          <option value="action3">动作3</option>
        </select>
      </div>
      <div class="flex justify-center gap-4 mb-6">
        <button onclick="startCapture()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
          开始捕捉
        </button>
        <button onclick="stopCapture()" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">
          停止捕捉
        </button>
      </div>
      <div class="flex flex-wrap justify-center gap-4">
        <video id="standard-video" controls class="border border-gray-300 rounded shadow-md">
          <source src="./Taichi.mp4" type="video/mp4" />
          您的浏览器不支持视频标签。
        </video>
        <img id="live-feed" alt="实时画面" class="border border-gray-300 rounded shadow-md" />
      </div>
    </div>

    <script>
      let { protocol, host } = window.location;
      let baseURL = protocol + "//" + host;
      const standardVideo = document.getElementById("standard-video");
      const liveFeed = document.getElementById("live-feed");
      const actionSelect = document.getElementById("action-select");

      function startCapture() {
        const selectedAction = actionSelect.value;
        if (selectedAction === "default") {
          alert("请选择一个动作！");
          return;
        }
        axios
          .post(baseURL + "/start_capture", { action: selectedAction })
          .then((response) => {
            standardVideo.play();
            console.log(response.data);
          })
          .catch((error) => console.error("Error:", error));
      }

      function stopCapture() {
        axios
          .post(baseURL + "/stop_capture")
          .then((response) => {
            standardVideo.pause();
            console.log(response.data);
          })
          .catch((error) => console.error("Error:", error));
      }

      standardVideo.addEventListener("play", () => {
        axios
          .post(baseURL + "/video_control", {
            action: "play",
            currentTime: standardVideo.currentTime,
          })
          .catch((error) => console.error("Error:", error));
      });

      standardVideo.addEventListener("pause", () => {
        axios
          .post(baseURL + "/video_control", { action: "pause" })
          .catch((error) => console.error("Error:", error));
      });

      const socket = io(baseURL);
      socket.on("frame", (data) => {
        liveFeed.src = `data:image/jpeg;base64,${data}`;
      });
    </script>
  </body>
</html>
