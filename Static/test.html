<!-- 
负责测试socket.io的功能
 
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket.IO 示例</title>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
</head>
<body>
    <h1>Socket.IO 示例</h1>
    <div>
        <h2>摄像头画面</h2>
        <img id="cameraFeed" alt="摄像头画面" style="max-width: 100%; border: 1px solid #ccc;">
    </div>
    <button onclick="startCapture()">开始</button>
    <button onclick="stopCapture()">结束</button>
    <input type="text" id="messageInput" placeholder="输入消息">
    <button onclick="sendMessage()">发送</button>
    <ul id="messages"></ul>

    <script>
        // 连接到 Socket.IO 服务器
        const socket = io("ws://localhost:8000");

        // 监听连接事件
        socket.on("connect", () => {
            console.log("已连接到服务器");
        });

        // 监听服务器发送的帧数据
        socket.on("frame", (data) => {
            const imgElement = document.getElementById("cameraFeed");
            imgElement.src = `data:image/jpeg;base64,${data}`;
        });

        // 监听服务器响应
        socket.on("message", (data) => {
            const li = document.createElement("li");
            li.textContent = `服务器响应: ${data}`;
            document.getElementById("messages").appendChild(li);
        });

        // 发送消息到服务器
        function sendMessage() {
            const message = document.getElementById("messageInput").value;
            socket.emit("custom", message);
        }

        // 开始捕获
        function startCapture() {
            fetch('/start_capture', { method: 'POST' })
                .then(response => response.json())
                .then(data => console.log(data))
                .catch(err => console.error('开始捕获失败:', err));
        }

        // 停止捕获
        function stopCapture() {
            fetch('/stop_capture', { method: 'POST' })
                .then(response => response.json())
                .then(data => console.log(data))
                .catch(err => console.error('停止捕获失败:', err));
        }
    </script>
</body>
</html>
