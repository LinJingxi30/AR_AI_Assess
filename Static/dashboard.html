<!DOCTYPE html>
<html lang="zh-cn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>设备监控</title>
    <script src="js/util/tailwindcss.js"></script>
    <script src="js/util/axios.min.js"></script>
    <script src="js/util/socket.io.min.js"></script>
  </head>
  <body class="bg-gray-100 text-gray-800">
    <header class="bg-blue-600 text-white py-4 text-center">
      <div class="flex justify-between items-center px-4">
        <button onclick="goBack()" class="bg-gray-200 text-gray-800 px-4 py-2 rounded hover:bg-gray-300">
          返回
        </button>
        <h1 class="text-2xl font-bold">设备监控</h1>
        <div></div> <!-- 占位符 -->
      </div>
    </header>
    <div class="container mx-auto p-4">
      <div class="mb-6">
        <h2 class="text-xl font-bold mb-4">连接信息</h2>
        <!-- 新增 RTMP 控制 -->
        <div class="mb-4">
          <label>摄像头名: <input id="cameraName" type="text" value="USB Camera" class="border px-2 py-1 rounded" /></label>
          <label>切割路数: <input id="rtmpN" type="number" value="2" min="1" max="8" class="border px-2 py-1 rounded" style="width:60px;" /></label>
          <button onclick="startRtmp()" class="bg-blue-600 text-white px-2 py-1 rounded hover:bg-blue-700">启动RTMP推流</button>
          <button onclick="stopRtmp()" class="bg-red-600 text-white px-2 py-1 rounded hover:bg-red-700">停止RTMP</button>
        </div>
        <div id="rtmpResult" class="mb-4 text-sm text-gray-700"></div>
        <table class="table-auto w-full border-collapse border border-gray-300">
          <thead>
            <tr class="bg-gray-200">
              <th class="border border-gray-300 px-4 py-2">Socket ID</th>
              <th class="border border-gray-300 px-4 py-2">房间</th>
              <th class="border border-gray-300 px-4 py-2">操作</th>
            </tr>
          </thead>
          <tbody id="connections-table"></tbody>
        </table>
      </div>
      <div id="rtmpRooms" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6"></div>
    </div>

    <script>
      function goBack() {
        window.location.href = "/";
      }

      let { protocol, host } = window.location;
      let baseURL = protocol + "//" + host;
      const connectionsTable = document.getElementById("connections-table");

      const socket = io(baseURL, { reconnection: true, reconnectionAttempts: 5 });

      // 默认加入 admin 房间
      socket.emit("join_room", { room: "admin" });

      socket.on("frame", (data) => {
        console.log("接收到视频帧数据");
      });

      socket.on("connect_error", (error) => {
        console.error("Socket.IO 连接错误:", error);
      });

      socket.on("disconnect", () => {
        console.warn("Socket.IO 断开连接，尝试重连...");
      });

      socket.on("reconnect", () => {
        console.log("Socket.IO 重连成功");
        socket.emit("join_room", { room: "admin" });
      });

      // 实时更新连接信息
      socket.on("update_connections", (connections) => {
        connectionsTable.innerHTML = connections
          .map(
            (conn) => `
            <tr>
              <td class="border border-gray-300 px-4 py-2">${conn.id}</td>
              <td class="border border-gray-300 px-4 py-2">
                <input type="text" value="${conn.room}" data-id="${conn.id}" class="room-input border border-gray-300 rounded px-2 py-1">
              </td>
              <td class="border border-gray-300 px-4 py-2">
                <button onclick="updateRoom('${conn.id}')" class="bg-green-600 text-white px-2 py-1 rounded hover:bg-green-700">更新</button>
              </td>
            </tr>
          `
          )
          .join("");
      });

      function updateRoom(socketId) {
        const input = document.querySelector(`input[data-id="${socketId}"]`);
        const newRoom = input.value;
        axios
          .post(baseURL + "/update_room", { id: socketId, room: newRoom })
          .then((response) => {
            alert("房间更新成功！");
          })
          .catch((error) => console.error("Error:", error));
      }

      // 用于管理每个房间的socket和img
      const roomSockets = {};

      async function refreshRtmpRooms() {
        const res = await axios.get('/api/rtmp_rooms');
        const rooms = res.data.rooms;
        const container = document.getElementById('rtmpRooms');
        if (!rooms.length) {
          container.innerHTML = '';
          // 断开所有socket
          Object.values(roomSockets).forEach(({ socket }) => socket.disconnect());
          Object.keys(roomSockets).forEach(k => delete roomSockets[k]);
          return;
        }
        container.innerHTML = rooms.map((room, idx) => `
          <div class="bg-white rounded shadow p-4 flex flex-col gap-2">
            <div class="font-bold">房间: ${room.room}</div>
            <div>RTMP地址: <span class="break-all">${room.rtmpUrl || '-'}</span></div>
            <div>状态: <span class="${room.running ? 'text-green-600' : 'text-gray-500'}">${room.running ? '运行中' : '未启动'}</span></div>
            <div>UUID: <span class="break-all">${room.uuid || '-'}</span></div>
            <div class="flex gap-2">
              <button onclick="startRoom(${idx})" class="bg-blue-600 text-white px-2 py-1 rounded hover:bg-blue-700" ${room.running ? 'disabled' : ''}>启动</button>
              <button onclick="stopRoom(${idx})" class="bg-red-600 text-white px-2 py-1 rounded hover:bg-red-700" ${!room.running ? 'disabled' : ''}>停止</button>
            </div>
            <img id="room-img-${idx}" class="w-full h-full object-contain bg-gray-200" alt="画面" />
          </div>
        `).join('');

        // 为每个运行中的房间建立socket并渲染画面
        rooms.forEach((room, idx) => {
          const imgId = `room-img-${idx}`;
          if (room.running) {
            if (!roomSockets[idx]) {
              // 新建socket并加入房间
              const s = io(window.location.origin, { transports: ['websocket'] });
              s.emit('join_room', { room: room.room });
              s.on('frame', (data) => {
                // 渲染图片
                const img = document.getElementById(imgId);
                if (img && data) {
                  const blob = new Blob([data], { type: "image/jpeg" });
                  const url = URL.createObjectURL(blob);
                  img.src = url;
                  // 释放旧的URL
                  if (img._lastUrl) URL.revokeObjectURL(img._lastUrl);
                  img._lastUrl = url;
                }
              });
              roomSockets[idx] = { socket: s };
            }
          } else {
            // 未运行则断开socket并清空画面
            if (roomSockets[idx]) {
              roomSockets[idx].socket.disconnect();
              delete roomSockets[idx];
            }
            const img = document.getElementById(imgId);
            if (img) img.src = "";
          }
        });
        // 清理多余的socket
        Object.keys(roomSockets).forEach(idx => {
          if (!rooms[idx] || !rooms[idx].running) {
            roomSockets[idx].socket.disconnect();
            delete roomSockets[idx];
          }
        });
      }

      async function startRoom(idx) {
        try {
          await axios.post('/api/start_room', { idx });
          setTimeout(refreshRtmpRooms, 500);
        } catch (e) {
          alert('启动失败: ' + (e.response?.data?.error || e.message));
        }
      }
      async function stopRoom(idx) {
        try {
          await axios.post('/api/stop_room', { idx });
          setTimeout(refreshRtmpRooms, 500);
        } catch (e) {
          alert('停止失败: ' + (e.response?.data?.error || e.message));
        }
      }

      // 启动/停止RTMP后刷新房间卡片
      async function startRtmp() {
        const n = parseInt(document.getElementById('rtmpN').value, 10);
        const cameraName = document.getElementById('cameraName').value;
        document.getElementById('rtmpResult').innerText = '启动中...';
        try {
          const res = await axios.post('/api/start_rtmp', { n, cameraName });
          document.getElementById('rtmpResult').innerText = 'RTMP地址:\n' + res.data.rtmpUrls.join('\n');
          setTimeout(refreshRtmpRooms, 500);
        } catch (e) {
          document.getElementById('rtmpResult').innerText = '启动失败: ' + (e.response?.data?.error || e.message);
        }
      }
      async function stopRtmp() {
        document.getElementById('rtmpResult').innerText = '停止中...';
        try {
          await axios.post('/api/stop_rtmp');
          document.getElementById('rtmpResult').innerText = '已停止';
          setTimeout(refreshRtmpRooms, 500);
        } catch (e) {
          document.getElementById('rtmpResult').innerText = '停止失败: ' + (e.response?.data?.error || e.message);
        }
      }

      // 页面加载时自动刷新
      refreshRtmpRooms();
      // setInterval(refreshRtmpRooms, 200);
    </script>
  </body>
</html>
