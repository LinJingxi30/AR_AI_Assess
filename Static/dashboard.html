<!DOCTYPE html>
<html lang="zh-cn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>设备监控</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
  </head>
  <body class="bg-gray-100 text-gray-800">
    <header class="bg-blue-600 text-white py-4 text-center">
      <h1 class="text-2xl font-bold">设备监控</h1>
    </header>
    <div class="container mx-auto p-4">
      <div class="mb-6">
        <h2 class="text-xl font-bold mb-4">连接信息</h2>
        <table class="table-auto w-full border-collapse border border-gray-300">
          <thead>
            <tr class="bg-gray-200">
              <th class="border border-gray-300 px-4 py-2">Socket ID</th>
              <th class="border border-gray-300 px-4 py-2">房间</th>
              <th class="border border-gray-300 px-4 py-2">操作</th>
            </tr>
          </thead>
          <tbody id="connections-table"></tbody>
        </table>
      </div>
    </div>

    <script>
      let { protocol, host } = window.location;
      let baseURL = protocol + "//" + host;
      const connectionsTable = document.getElementById("connections-table");

      const socket = io(baseURL, {
        reconnection: true,
        reconnectionAttempts: 5,
        query: { idPrefix: "dashboard-" },
      });

      // 默认加入 admin 房间
      socket.emit("join_room", { room: "admin" });

      socket.on("frame", (data) => {
        console.log("接收到视频帧数据");
      });

      socket.on("connect_error", (error) => {
        console.error("Socket.IO 连接错误:", error);
      });

      socket.on("disconnect", () => {
        console.warn("Socket.IO 断开连接，尝试重连...");
      });

      socket.on("reconnect", () => {
        console.log("Socket.IO 重连成功");
        socket.emit("join_room", { room: "admin" });
      });

      // 实时更新连接信息
      socket.on("update_connections", (connections) => {
        connectionsTable.innerHTML = connections
          .map(
            (conn) => `
            <tr>
              <td class="border border-gray-300 px-4 py-2">${conn.id}</td>
              <td class="border border-gray-300 px-4 py-2">
                <input type="text" value="${conn.room}" data-id="${conn.id}" class="room-input border border-gray-300 rounded px-2 py-1">
              </td>
              <td class="border border-gray-300 px-4 py-2">
                <button onclick="updateRoom('${conn.id}')" class="bg-green-600 text-white px-2 py-1 rounded hover:bg-green-700">更新</button>
              </td>
            </tr>
          `
          )
          .join("");
      });

      function updateRoom(socketId) {
        const input = document.querySelector(`input[data-id="${socketId}"]`);
        const newRoom = input.value;
        axios
          .post(baseURL + "/update_room", { id: socketId, room: newRoom })
          .then((response) => {
            alert("房间更新成功！");
          })
          .catch((error) => console.error("Error:", error));
      }
    </script>
  </body>
</html>
