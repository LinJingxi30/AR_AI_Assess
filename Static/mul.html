<!DOCTYPE html>
<html lang="zh-cn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多视频监控</title>
    <style>
        .video-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 20px;
        }

        .video-container video,
        .video-container img {
            width: 48%;
            height: auto;
            border: 1px solid black;
        }
    </style>
</head>

<body>
    <div class="video-container">
        <video id="standard-video" muted>
            <source src="./Taichi.mp4" type="video/mp4">
            您的浏览器不支持视频标签。
        </video>
        <img id="output" alt="实时骨架动画">
    </div>

    <script>
        const output = document.getElementById("output");
        const standardVideo = document.getElementById("standard-video");
        let ws;
        let {protocol,host} = window.location;
        ws = new WebSocket((protocol==="http:"?"ws://":"wss://")+host+"/ws");

        ws.onopen = function (event) {
            console.log("WebSocket is open now.");
        };

        ws.onmessage = (event) => {
            // console.log("WebSocket message received:", event);
            try {
                const data = JSON.parse(event.data);
                console.log("WebSocket data received:", data);
                if (data.type === "video_control") {
                    if (data.action === "play") {
                        standardVideo.currentTime = data.currentTime;
                        standardVideo.play()
                    } else if (data.action === "pause") {
                        standardVideo.pause();
                    }
                }else if(data.type === "video"){
                    output.src = data.image;
                }
            } catch (e) {
                console.log("WebSocket message received:", event.data);
            }
        };

        ws.onclose = function (event) {
            console.log("WebSocket is closed now.");
        };
    </script>
</body>

</html>
