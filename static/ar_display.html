<!-- ar_display.html -->
<!DOCTYPE html>
<html>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
let renderer, camera, scene, skeleton;

// 1. 初始化3D场景
function init() {
    // AR显示配置
    renderer = new THREE.WebGLRenderer({ alpha: true });
    camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 10);
    scene = new THREE.Scene();
    
    // 2. 创建虚拟骨架
    skeleton = createSkeletonModel();
    scene.add(skeleton);
    
    // 3. 连接WebSocket获取数据
    const ws = new WebSocket('ws://localhost:8765');
    ws.onmessage = (event) => {
        const points = JSON.parse(event.data);
        updateSkeleton(points);
    };
}

// 4. 动态更新骨架位置
function updateSkeleton(arPoints) {
    arPoints.forEach((pos, i) => {
        const joint = skeleton.children[i];
        joint.position.set(pos[0], pos[1], pos[2]);
    });
}

// 5. 创建骨架模型（简化示例）
function createSkeletonModel() {
    const group = new THREE.Group();
    const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
    
    // 创建关节球体
    for(let i=0; i<33; i++) { // MediaPipe Pose有33个关键点
        const sphere = new THREE.Mesh(
            new THREE.SphereGeometry(0.02),
            material
        );
        group.add(sphere);
    }
    return group;
}

// 启动场景
init();
</script>
</body>
</html>
