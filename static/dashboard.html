<!DOCTYPE html>
<html lang="zh-cn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>设备监控</title>
    <style>
      .video-container {
        display: flex;
        justify-content: space-around;
        align-items: center;
        margin-top: 20px;
      }
      .video-container video,
      .video-container img {
        width: 48%;
        height: auto;
        border: 1px solid black;
      }
      #controls {
        margin-top: 20px;
        text-align: center;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  </head>
  <body>
    <h1>设备监控</h1>
    <div id="controls">
      <button onclick="startCapture()">开始捕捉</button>
      <button onclick="stopCapture()">停止捕捉</button>
    </div>
    <div class="video-container">
      <video id="standard-video" controls>
        <source src="./Taichi.mp4" type="video/mp4" />
        您的浏览器不支持视频标签。
      </video>
      
    </div>

    <script>
      let baseURL = "";
      const standardVideo = document.getElementById("standard-video");

      function startCapture() {
        axios
          .post(baseURL + "/start_capture")
          .then((response) => {
            standardVideo.play();
            console.log(response.data);
          })
          .catch((error) => console.error("Error:", error));
      }

      function stopCapture() {
        axios
          .post(baseURL + "/stop_capture")
          .then((response) => {
            standardVideo.pause();
            console.log(response.data);
          })
          .catch((error) => console.error("Error:", error));
      }


      standardVideo.addEventListener("play", () => {
        axios
          .post(baseURL + "/video_control", {
            action: "play",
            currentTime: standardVideo.currentTime,
          })
          .catch((error) => console.error("Error:", error));
      });

      standardVideo.addEventListener("pause", () => {
        axios
          .post(baseURL + "/video_control", { action: "pause" })
          .catch((error) => console.error("Error:", error));
      });
    </script>
  </body>
</html>
